[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pymyapp"
readme = "README.md"
authors = [
    { name = "Ernesto Casablanca", email = "casablancaernesto@gmail.com" },
]
maintainers = [
    { name = "Ernesto Casablanca", email = "casablancaernesto@gmail.com" },
]
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
keywords = ["neural network", "kernel"]
requires-python = ">= 3.8"
dynamic = ["version", "description"]

[project.urls]
Homepage = "https://tendto.github.io/myapp/"
Documentation = "https://tendto.github.io/myapp/"
Repository = "https://github.com/TendTo/myapp.git"
Issues = "https://github.com/TendTo/myapp/issues"
Changelog = "https://github.com/TendTo/myapp/blob/main/docs/Changelog.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pymyapp = "pymyapp.__main__:main"
pymyapp-gui = "pymyapp.gui:main"

[tool.setuptools]
packages = []

# Black configuration (code formatter)
[tool.black]
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313', 'py314', 'py315']
line-length = 120
include = '(benchmarks|bindings/pymyapp|tests/bindings/pymyapp)\/.*\.py'

# Isort configuration (import sorter)
[tool.isort]
profile = "black"

[tool.pytest.ini_options]
python_files = "Test*.py"

[tool.uv]
no-build-isolation-package = ["pymyapp"]
